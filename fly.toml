# fly.toml app configuration file generated for venus-admin on 2026-10-17T18:26:20-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'venus-admin'
primary_region = 'gru'

[build]
[deploy]
  release_command = '/migrate'

[env]
  APP_ENV = 'prod'
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  PUBLIC_URL = 'https://venus-admin.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
